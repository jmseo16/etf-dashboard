<title>HSIO 명세 루프</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* layout: one header band, a 4-stage pipeline row, then a circuit matrix and an event log side by side */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --ink:#15191c; --mute:#5d666c; --line:#d6dad6;
  --accent:#1f6f8b; --wait:#8a9298; --run:#c47f12; --ok:#2f7d4f; --bad:#b3362c; --hold:#6b55a6;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121618; --panel:#1b2124; --ink:#e4e8e6; --mute:#9aa4a9; --line:#2d3539;
  --accent:#5fb3cf; --wait:#7d878d; --run:#e3a446; --ok:#5cb985; --bad:#e2675c; --hold:#a594dc; --chip-bg:#242c30; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121618; --panel:#1b2124; --ink:#e4e8e6; --mute:#9aa4a9; --line:#2d3539;
  --accent:#5fb3cf; --wait:#7d878d; --run:#e3a446; --ok:#5cb985; --bad:#e2675c; --hold:#a594dc; --chip-bg:#242c30; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--f-body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
h1{font-size:22px;margin:0;font-weight:700;text-wrap:balance}
.sub{color:var(--mute);font-size:13px}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.tag{font:500 12px var(--f-mono);background:var(--chip-bg);border:1px solid var(--line);border-radius:4px;padding:3px 8px;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--f-body);border-radius:999px;padding:2px 10px;border:1px solid currentColor;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-wait{color:var(--wait)} .s-run{color:var(--run)} .s-ok{color:var(--ok)} .s-bad{color:var(--bad)} .s-hold{color:var(--hold)}
.s-run::before{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.s-run::before{animation:none}}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0 0 10px;font-weight:600}
.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:stretch}
@media (max-width:900px){.pipe{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.pipe{grid-template-columns:1fr}}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;display:grid;gap:8px;align-content:start;min-width:0;position:relative}
.stage .who{font:500 12px var(--f-mono);color:var(--accent)}
.stage h3{margin:0;font-size:15px}
.stage .task{font-size:13px}
.stage .rep{font-size:12.5px;color:var(--mute);border-top:1px dashed var(--line);padding-top:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.stage .rep:empty{display:none}
.sublist{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.sublist li{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px}
.two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;min-width:0}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--mute);font-size:12px}
td.c{font:500 13px var(--f-mono)}
.note{font-size:12px;color:var(--mute);margin-top:4px;overflow-wrap:anywhere}
.log{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-height:520px;overflow:auto}
.log li{display:grid;grid-template-columns:52px 76px minmax(0,1fr);gap:8px;font-size:13px}
.log time,.log .a{font:12px var(--f-mono);color:var(--mute);font-variant-numeric:tabular-nums}
.log .a{color:var(--accent)}
.spec li{font-size:13px;margin:4px 0}
.spec{margin:0;padding-left:18px}
.bar{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--chip-bg)}
.bar i{display:block;height:100%}
.b-ok{background:var(--ok)}.b-bad{background:var(--bad)}.b-na{background:var(--wait);opacity:.5}
.reports{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.reports li{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13px}
.reports button{font:600 13px var(--f-body);color:var(--accent);background:none;border:1px solid var(--line);border-radius:4px;padding:4px 10px;cursor:pointer}
.reports button:focus-visible,#vclose:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.viewer{margin-top:14px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.vbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:var(--chip-bg);font-size:13px}
#vclose{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:4px;padding:3px 10px;cursor:pointer}
#vframe{display:block;width:100%;height:80vh;border:0;background:#fff}
</style>

<div class="wrap">
<header>
  <div>
    <h1>HSIO 명세 루프</h1>
    <div class="sub">netlist 생성 → 그리기 → 명세 검증 → 판정, 판정이 불합격이면 명세서를 고쳐 다시 돈다</div>
  </div>
  <div class="meta" id="meta"></div>
</header>

<section>
  <h2>파이프라인</h2>
  <div class="pipe" id="pipe"></div>
</section>

<div class="two">
  <section class="card">
    <h2>회로별 진행</h2>
    <div class="tbl"><table id="matrix"></table></div>
  </section>
  <section class="card">
    <h2>이벤트 기록</h2>
    <ul class="log" id="log"></ul>
  </section>
</div>

<section class="card">
  <h2>체크리스트 추이 (AGENT 2 ↔ AGENT 3 안쪽 루프)</h2>
  <div class="note">27항목 중 통과·불통과·해당 없음. ★ 불통과가 하나라도 있으면 불합격. 원인: 그린 쪽(→ AGENT 2에게 돌려보냄) / 명세서(→ 명세서 수정)</div>
  <div class="tbl"><table id="rounds"></table></div>
</section>

<section class="card">
  <h2>검증 보고서 (AGENT 3)</h2>
  <ul class="reports" id="reports"></ul>
  <div class="viewer" id="viewer" hidden>
    <div class="vbar"><strong id="vtitle"></strong><button type="button" id="vclose">닫기</button></div>
    <iframe id="vframe" title="검증 보고서"></iframe>
  </div>
</section>

<section class="card">
  <h2>명세서 변경 이력</h2>
  <ul class="spec" id="spec"></ul>
</section>
</div>

const $ = id => document.getElementById(id);
const chip = ([s, t]) => `<span class="chip s-${s}">${t}</span>`;
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
$("meta").innerHTML = `<span class="tag">회차 ${LOOP.iteration}</span><span class="tag">명세서 ${LOOP.spec}</span><span class="tag">${esc(LOOP.updated)}</span>${chip(LOOP.overall)}`;
$("pipe").innerHTML = LOOP.stages.map(s => `<div class="stage">
  <div class="who">${s.who}</div>
  <h3>${s.title}</h3>
  <div>${chip(s.status)}</div>
  <div class="task">${esc(s.task)}</div>
  ${s.sub ? `<ul class="sublist">${s.sub.map(([n, st, t]) => `<li><span>${n}</span>${chip([st, t])}</li>`).join("")}</ul>` : ""}
  <div class="rep">${esc(s.report)}</div></div>`).join("");
$("matrix").innerHTML = `<tr><th>회로</th><th>netlist</th><th>그림</th><th>검증</th><th>안쪽 루프</th><th>판정</th></tr>` +
  LOOP.matrix.map(r => `<tr><td class="c">${r.c}${r.note ? `<div class="note">${esc(r.note)}</div>` : ""}</td><td>${chip(r.netlist)}</td><td>${chip(r.draw)}</td><td>${chip(r.verify)}</td><td class="c">${r.loop || "—"}</td><td>${chip(r.verdict)}</td></tr>`).join("");
$("log").innerHTML = LOOP.log.slice().reverse().map(([t, a, m]) => `<li><time>${t}</time><span class="a">${a}</span><span>${esc(m)}</span></li>`).join("");
const bar = r => { const tot = r.pass + r.fail + r.na || 1; return `<div class="bar" title="통과 ${r.pass} · 불통과 ${r.fail} · 해당 없음 ${r.na}"><i class="b-ok" style="width:${100*r.pass/tot}%"></i><i class="b-bad" style="width:${100*r.fail/tot}%"></i><i class="b-na" style="width:${100*r.na/tot}%"></i></div>`; };
$("rounds").innerHTML = LOOP.rounds.length ? `<tr><th>회로</th><th>라운드</th><th>통과</th><th>불통과</th><th>해당 없음</th><th>★ 불통과</th><th>원인 그린 쪽 / 명세서</th><th></th></tr>` + LOOP.rounds.map(r => `<tr><td class="c">${r.c}</td><td class="c">${r.round}</td><td class="c">${r.pass}</td><td class="c">${r.fail}</td><td class="c">${r.na}</td><td class="c">${r.star}</td><td class="c">${r.drawer} / ${r.spec}</td><td style="min-width:120px">${bar(r)}</td></tr>`).join("") : `<tr><td class="note">아직 없음 — AGENT 3의 첫 검증이 끝나면 채워집니다</td></tr>`;
$("reports").innerHTML = LOOP.reports.length ? LOOP.reports.map(([n, href, st, d]) => `<li><button type="button" data-href="${href}" data-title="${n}">${n} 보고서 열기</button>${chip(st)}<span class="note">${esc(d)}</span></li>`).join("") : `<li class="note">아직 없음</li>`;
document.querySelectorAll("#reports button").forEach(b => b.addEventListener("click", async () => {
  $("viewer").hidden = false; $("vtitle").textContent = b.dataset.title + " 검증 보고서 (불러오는 중…)";
  try { const r = await fetch(b.dataset.href); if (!r.ok) throw new Error(r.status);
    $("vframe").srcdoc = await r.text(); $("vtitle").textContent = b.dataset.title + " 검증 보고서"; }
  catch (e) { $("vtitle").textContent = "보고서를 불러오지 못했습니다 (" + e.message + "). 페이지를 새로고침한 뒤 다시 눌러 주세요."; }
  $("viewer").scrollIntoView({behavior: "smooth", block: "start"});
}));
$("vclose").addEventListener("click", () => { $("viewer").hidden = true; $("vframe").srcdoc = ""; });
$("spec").innerHTML = LOOP.spec_changes.map(x => `<li>${esc(x)}</li>`).join("");
</script>
